server:
  address: 127.0.0.1
  port: 8008

logging:
  enabled: true
  level: info
  to_file: false
  file_path: logs/server
  rotation_size: 10485760
  max_files: 5

rag:
  route:
    ui_path: /rag
    api_prefix: /api/rag

  llm:
    enabled: true
    api_url: http://localhost:11434
    model: llama3.2:3b
    request_timeout_ms: 30000
    temperature: 0.2
    max_tokens: 2048

  embedding:
    # Default is dependency-light lexical retrieval. It works without model files.
    backend: tfidf
    enable_fallback: true

    # To enable semantic retrieval with ONNX Runtime:
    # 1. Build with ONNX Runtime available.
    # 2. Put the embedding model and tokenizer under models/.
    # 3. Change backend to onnx and uncomment the paths below.
    #
    # backend: onnx
    # model_path: models/semantic_model.onnx
    # tokenizer_path: models/tokenizer.json
    # max_seq_len: 512
    # onnx_threads: 2
    # normalize_embeddings: true

  search:
    use_hybrid: true
    top_k: 5
    min_score_threshold: 0.0

  indexing:
    max_file_size_kb: 1024

  sqlite:
    enabled: true
    db_path: data/rag_kb.db
    source_id: local_qa
    name: Local QA knowledge base
    auto_migrate: true

  markdown:
    enabled: true
    directory_path: knowledge_base
    recursive: true

  cache:
    enabled: true
    backend: memory
    max_size: 1000
    ttl_seconds: 3600

  rate_limit:
    enabled: false

  prompt_cache:
    enabled: true
    max_size: 100
    ttl_seconds: 3600
