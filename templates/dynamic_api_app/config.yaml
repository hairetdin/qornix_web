server:
  address: 127.0.0.1
  port: 8008
logging:
  enabled: true
  level: info
  to_file: false
  file_path: logs/server
  rotation_size: 10485760
  max_files: 5
database:
  driver: sqlite
  path: app.sqlite3
dynamic_api:
  enabled: true
  route_prefix: /api/dynamic
  schema_prefix: /api/dynamic/schema
  schema:
    file: schema/app.schema.xml
    exported_file: schema/database.schema.xml
    history_file: schema/schema_history.jsonl
    xsd_file: schema/schema_app.xsd
    allow_destructive_apply: false
  query:
    default_limit: 100
    max_limit: 1000
    allow_raw_filter: false
    allow_raw_join: true
    allow_delete_without_filter: false
    allow_update_without_filter: false
