server:
  address: 127.0.0.1
  port: 8008
logging:
  enabled: true
  level: info
  to_file: false
  file_path: logs/server
  rotation_size: 10485760
  max_files: 5
database:
  driver: sqlite
  path: app.sqlite3
dynamic_api:
  enabled: true
  route_prefix: /api/dynamic
  schema_prefix: /api/dynamic/schema
  schema:
    file: backend/schema/app.schema.xml
    exported_file: backend/schema/database.schema.xml
    history_file: backend/schema/schema_history.jsonl
    xsd_file: backend/schema/schema_app.xsd
    allow_destructive_apply: false
  query:
    default_limit: 100
    max_limit: 1000
    allow_raw_filter: false
    allow_raw_join: true
    allow_delete_without_filter: false
    allow_update_without_filter: false
  async:
    query_timeout_ms: 2000
    route_timeout_ms: 30000
    max_body_size: 1048576
    max_concurrent_db_operations: 128
    # SQLite uses the explicit sync_offloaded async adapter, whose prepared
    # statement API is intentionally disabled. PostgreSQL/MySQL can set this true.
    prepared_queries: false

# postgres_async_example:
#   Build with -DQORNIX_ENABLE_ASYNC_POSTGRES=ON and replace the database
#   block above with driver: postgres plus host/port/database/user/password.
#   Use pool/query timeouts from dynamic_api.async and database.pool.
# mysql_async_example:
#   Build with -DQORNIX_ENABLE_ASYNC_MYSQL=ON and replace the database
#   block above with driver: mysql plus host/port/database/user/password.
#   MySQL uses ? placeholders and does not use RETURNING.
