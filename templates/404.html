<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' font-family='Arial, sans-serif'%3E🦅%3C/text%3E%3C/svg%3E">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .error-section {
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 80px;
            color: #e74c3c;
            margin: 20px 0;
            font-weight: bold;
        }
        .error-title {
            font-size: 32px;
            color: #2c3e50;
            margin: 20px 0;
        }
        .error-message {
            font-size: 18px;
            color: #7f8c8d;
            margin: 20px 0 30px;
            line-height: 1.6;
        }
        .home-link {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .home-link:hover {
            background: #2980b9;
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-section">
        <div class="emoji">🔍</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The requested page does not exist or has been moved.<br>
            Check the URL or return to the home page.
        </p>
        <a href="/" class="home-link">← Back to Home</a>
    </div>
</div>
</body>
</html>
