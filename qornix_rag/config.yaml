# Configuration Qornix RAG

server:
  host: 0.0.0.0
  port: 8082
  project_path: ../..

search:
  use_hybrid: true
  vector_weight: 0.6
  text_weight: 0.4
  top_k: 10
  min_score_threshold: 0.1

indexing:
  embedding_dim: 256
  max_file_size_kb: 512
  skip_directories:
    - cmake-build
    - .git
    - build
    - __pycache__
    - node_modules

embedding:
  backend: onnx
  model_path: models/semantic_model.onnx
  tokenizer_path: models/tokenizer.json
  max_seq_len: 256
  onnx_threads: 2
  normalize_embeddings: true
  enable_fallback: true
