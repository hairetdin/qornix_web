# Qornix dynamic_web_query_builder_server configuration (YAML format, roadmap v0.0.3)
#
# This example initializes and uses the demo SQLite database from C++ code.
# Active path:
#   example/dynamic_web_query_builder_server/dynamic_web_query_builder_demo.sqlite3

app:
  name: dynamic_web_query_builder_server
  version: 0.0.1

server:
  address: 127.0.0.1
  port: 8008

db:
  driver: sqlite
  connection_string: dynamic_web_query_builder_demo.sqlite3

dynamic_api:
  async:
    query_timeout_ms: 2000
    route_timeout_ms: 30000
    max_body_size: 1048576
    max_concurrent_db_operations: 128
    # SQLite runs through the explicit sync_offloaded adapter in async route mode.
    prepared_queries: false

logging:
  enabled: true
  level: debug
  to_file: false
